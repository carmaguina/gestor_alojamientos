<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestor de Alojamientos{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Gestor de Alojamientos</h1>
        <nav>
            <a href="{% url 'alojamientos:unidad_list' %}">Unidades</a>
            <a href="{% url 'blog:post_list' %}">Blog</a>
            <a href="/admin/">Admin</a>
        </nav>

        {% if user.is_authenticated %}
            <p>Hola, {{ user.username }}</p>

            <p>
                <a href="{% url 'usuarios:perfil' %}">Mi perfil</a>
            </p>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Cerrar sesion</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Iniciar sesion</a>
            <a href="{% url 'usuarios:registro' %}">Registrarse</a>
        {% endif %}
    </header>

    <hr>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
