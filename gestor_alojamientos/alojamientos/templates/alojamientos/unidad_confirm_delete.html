{% extends 'base.html' %}

{% block title %}Eliminar unidad{% endblock %}

{% block content %}
<h2>Eliminar unidad</h2>

<p>Seguro que queres eliminar la unidad "{{ unidad.nombre }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Si, eliminar</button>
</form>

<a href="{% url 'alojamientos:unidad_detail' unidad.pk %}">Cancelar</a>
{% endblock %}
