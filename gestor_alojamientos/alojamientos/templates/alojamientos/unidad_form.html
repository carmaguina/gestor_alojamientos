{% extends 'base.html' %}

{% block title %}{% if object %}Editar unidad{% else %}Crear unidad{% endif %}{% endblock %}

{% block content %}
<h2>{% if object %}Editar unidad{% else %}Crear unidad{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Guardar</button>
</form>

<a href="{% url 'alojamientos:unidad_list' %}">Volver a la lista</a>
{% endblock %}
