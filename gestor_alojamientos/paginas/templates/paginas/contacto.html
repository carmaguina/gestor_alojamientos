{% extends 'base.html' %}

{% block title %}Contacto - Gestor de Alojamientos{% endblock %}

{% block content %}
    <h2>Contacto</h2>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Enviar mensaje</button>
    </form>
{% endblock %}
