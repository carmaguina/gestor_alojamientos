{% extends 'base.html' %}

{% block title %}{{ post.titulo }} - Blog{% endblock %}

{% block content %}
    <h2>{{ post.titulo }}</h2>

    <p><strong>Fecha:</strong> {{ post.fecha_creacion }}</p>

    <p>{{ post.contenido }}</p>

    <p>
        <a href="{% url 'blog:post_list' %}">Volver al blog</a>
    </p>
{% endblock %}
